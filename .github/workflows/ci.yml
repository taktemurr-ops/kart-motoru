name: CI - analyze and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test --reporter expanded
  # Oyun testi ekran görüntüleri: yalnız çalışma dallarında (main'de koşmaz).
  shots:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true
      - run: sudo apt-get install -y fonts-noto-core fonts-noto-cjk >/dev/null 2>&1 || true
      - run: flutter pub get
      - name: Görüntüler
        run: |
          set -o pipefail
          export SHOTS_ONLY="$(cat test/shots_only.txt 2>/dev/null || true)"
          export SHOTS_LEVELS="$(cat test/shots_levels.txt 2>/dev/null || echo 1,3,10)"
          flutter test test/shots_test.dart --tags shots --run-skipped --reporter expanded 2>&1 | tee shots.log
      - run: mkdir -p build/shots && grep -h "SONUC|" shots.log > build/shots/sonuc.txt || true
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots
          path: build/shots
          retention-days: 3

