name: Oyun testi ekran görüntüleri
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Oyun kimlikleri (virgüllü, boş: hepsi)"
        required: false
        default: ""
      levels:
        description: "Bölümler"
        required: false
        default: "1,3,10"
permissions:
  contents: read
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true
      - run: sudo apt-get install -y fonts-noto-core fonts-noto-cjk >/dev/null 2>&1 || true
      - run: flutter pub get
      - name: Görüntüler
        env:
          SHOTS_ONLY: ${{ inputs.only }}
          SHOTS_LEVELS: ${{ inputs.levels }}
        run: flutter test test/shots_test.dart --tags shots --run-skipped --reporter expanded 2>&1 | tee shots.log
      - run: grep -h "SONUC|" shots.log > build/shots/sonuc.txt || true
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots
          path: build/shots
          retention-days: 3
